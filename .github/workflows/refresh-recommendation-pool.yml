# 추천 이슈 후보 풀 갱신 스케줄러
# 언제 실행되나?
#   - popular 조건: 12시간마다
#   - latest 조건: 3시간마다
#   - Actions 탭에서 수동 실행(workflow_dispatch)도 가능 (조건 선택)
#
# 무엇을 하나?
#   단일 오케스트레이터가 /api/cron/refresh-recommendation-pool 엔드포인트를 언어별로
#   순차 호출하고, 호출 사이 페이싱과 GitHub rate-limit cooldown을 전역으로 관리한다.
#   각 응답은 해당 언어+조건의 후보 풀만 DB에 저장한다. 대시보드 요청 경로는 이 워크플로가
#   채워둔 DB만 읽고, GitHub는 절대 직접 호출하지 않는다.
#
# 왜 언어별로 쪼개서 호출하나?
#   13개 언어를 한 번의 API 호출에서 다 처리하면 Vercel 함수 실행 시간 상한을 실측상
#   넘겨서 언어 하나당 호출 하나로 나눈다. 순회와 실패 격리는 Actions의 Node 스크립트가 담당한다.
#
# 필요한 저장소 시크릿:
#   CRON_SECRET — /api/cron/refresh-recommendation-pool이 검증하는 값과 동일해야 한다
#   (Vercel 프로젝트 환경변수의 CRON_SECRET과 같은 값을 GitHub 저장소 Secrets에도 등록)

name: Refresh recommendation pool

on:
  schedule:
    # 정각 혼잡을 피하고, popular 실행이 latest와 겹치지 않도록 최소 90분 간격을 둔다.
    - cron: '17 */3 * * *' # latest — 3시간마다
    - cron: '47 1,13 * * *' # popular — 12시간마다
  workflow_dispatch:
    inputs:
      condition:
        description: '수동 실행 시 갱신할 조건'
        required: true
        type: choice
        options: [popular, latest]

env:
  SITE_URL: https://openissuemap.com

# latest/popular/수동 실행이 같은 GitHub 자격 증명을 사용하므로 전체 실행을 하나씩 처리한다.
concurrency:
  group: recommendation-pool-refresh
  cancel-in-progress: false

jobs:
  # 두 스케줄 중 어느 것이 워크플로를 트리거했는지로 condition을 결정한다.
  # 수동 실행이면 입력값을 그대로 쓴다.
  determine-condition:
    runs-on: ubuntu-latest
    outputs:
      condition: ${{ steps.set.outputs.condition }}
    steps:
      - name: 조건 결정
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "condition=${{ inputs.condition }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 */3 * * *" ]; then
            echo "condition=latest" >> "$GITHUB_OUTPUT"
          else
            echo "condition=popular" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: determine-condition
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 후보 풀 순차 갱신
        run: node scripts/refresh-recommendation-pool.mjs
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          REFRESH_CONDITION: ${{ needs.determine-condition.outputs.condition }}
          REFRESH_PACING_MS: 15000
          REFRESH_DEADLINE_MS: 1500000
          REFRESH_REQUEST_TIMEOUT_MS: 60000
