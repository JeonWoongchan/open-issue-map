# 추천 이슈 후보 풀 갱신 스케줄러
# 언제 실행되나?
#   - popular 조건: 12시간마다
#   - latest 조건: 3시간마다
#   - Actions 탭에서 수동 실행(workflow_dispatch)도 가능 (조건 선택)
#
# 무엇을 하나?
#   /api/cron/refresh-recommendation-pool 엔드포인트를 언어 하나씩 순서대로(단, 한 번에
#   max-parallel개까지만 동시에) 호출해서, 그 언어+조건의 GitHub 후보 풀을 새로 가져와
#   DB에 저장하게 한다. 대시보드 요청 경로는 이 워크플로가 채워둔 DB만 읽고, GitHub는
#   절대 직접 호출하지 않는다.
#
# 왜 언어별로 쪼개서 호출하나?
#   13개 언어를 한 번의 API 호출에서 다 처리하면 Vercel 함수 실행 시간 상한을 실측상
#   넘겨서, 언어 하나당 호출 하나로 나누고 팬아웃을 여기(matrix)가 담당한다.
#
# 필요한 저장소 시크릿:
#   CRON_SECRET — /api/cron/refresh-recommendation-pool이 검증하는 값과 동일해야 한다
#   (Vercel 프로젝트 환경변수의 CRON_SECRET과 같은 값을 GitHub 저장소 Secrets에도 등록)

name: Refresh recommendation pool

on:
  schedule:
    # 정각 혼잡을 피하고, popular 실행이 latest와 겹치지 않도록 최소 90분 간격을 둔다.
    - cron: '17 */3 * * *' # latest — 3시간마다
    - cron: '47 1,13 * * *' # popular — 12시간마다
  workflow_dispatch:
    inputs:
      condition:
        description: '수동 실행 시 갱신할 조건'
        required: true
        type: choice
        options: [popular, latest]

env:
  SITE_URL: https://openissuemap.com

jobs:
  # 두 스케줄 중 어느 것이 워크플로를 트리거했는지로 condition을 결정한다.
  # 수동 실행이면 입력값을 그대로 쓴다.
  determine-condition:
    runs-on: ubuntu-latest
    outputs:
      condition: ${{ steps.set.outputs.condition }}
    steps:
      - name: 조건 결정
        id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "condition=${{ inputs.condition }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 */3 * * *" ]; then
            echo "condition=latest" >> "$GITHUB_OUTPUT"
          else
            echo "condition=popular" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: determine-condition
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # 13개를 한꺼번에 병렬 호출하면 GitHub 2차(버스트) 레이트리밋에 걸릴 수 있어 페이싱한다.
      max-parallel: 1
      # 언어 하나가 일시적으로 실패해도(레이트리밋, 타임아웃 등) 나머지 언어는 계속 진행한다 —
      # 실패한 언어는 다음 스케줄 때 자연히 다시 시도된다.
      fail-fast: false
      matrix:
        language:
          - TypeScript
          - JavaScript
          - Python
          - Rust
          - Go
          - Java
          - C
          - C++
          - C#
          - Ruby
          - Swift
          - Kotlin
          - PHP
    steps:
      - name: 후보 풀 갱신 요청
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 5 --max-time 60 \
            --write-out '\nhttp=%{http_code} total=%{time_total}s\n' \
            -G -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            --data-urlencode "condition=${{ needs.determine-condition.outputs.condition }}" \
            --data-urlencode "language=${{ matrix.language }}" \
            "${{ env.SITE_URL }}/api/cron/refresh-recommendation-pool"
